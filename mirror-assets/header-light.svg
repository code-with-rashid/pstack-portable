<svg xmlns="http://www.w3.org/2000/svg" width="960" height="244" viewBox="0 0 960 244" role="img" aria-labelledby="title desc">
  <title id="title">How the pstack mirror works</title>
  <desc id="desc">cursor/plugins/pstack is kept in sync with the mirror backnotprop/pstack. npx skills add backnotprop/pstack installs it into Claude Code, Codex, Pi, Cursor, OpenCode, and other agents.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .fg { fill: #0c121a; }
    .mfg { fill: #4b525d; }
    .pri { fill: #5537eb; }
    .wire { fill: none; stroke: #5537eb; stroke-width: 1.4; stroke-linecap: round; opacity: 0.5; }
    .spark { fill: none; stroke: #5537eb; stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 6 300; stroke-dashoffset: 6; }
    .s1 { animation: s1 4.8s ease-in-out infinite; }
    .s2 { animation: s2 4.8s ease-in-out infinite; }
    @keyframes s1 { 0% { stroke-dashoffset: 6; } 30%, 100% { stroke-dashoffset: -100; } }
    @keyframes s2 { 0%, 30% { stroke-dashoffset: 6; } 70%, 100% { stroke-dashoffset: -100; } }
    @media (prefers-reduced-motion: reduce) { .spark { animation: none; } }
  </style>
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#d4d8de" opacity=".8"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L8 5 L1 9" fill="none" stroke="#5537eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="243" rx="16" fill="#f6f8fa" stroke="#d4d8de"/>
  <rect x="0.5" y="0.5" width="959" height="243" rx="16" fill="url(#dots)"/>

  <g transform="translate(0 -70)">
  <!-- upstream -> mirror -->
  <path class="wire" d="M276 197 L337 197" marker-end="url(#arrow)"/>
  <path class="spark s1" d="M276 197 L337 197" pathLength="100"/>
  <text x="308" y="185" text-anchor="middle" class="mono mfg" font-size="11">sync</text>

  <rect x="40" y="157" width="236" height="80" rx="12" fill="#ffffff" stroke="#d4d8de" stroke-width="1"/>
  <text x="58" y="187" class="mono mfg" font-size="11" letter-spacing="1.4">UPSTREAM</text>
  <text x="58" y="213" class="mono fg" font-size="15" font-weight="600">cursor/plugins/pstack</text>

  <rect x="340" y="157" width="236" height="80" rx="12" fill="#ffffff" stroke="#5537eb" stroke-width="1.5"/>
  <rect x="340" y="157" width="236" height="80" rx="12" fill="#5537eb14"/>
  <text x="358" y="187" class="mono pri" font-size="11" letter-spacing="1.4">THIS MIRROR</text>
  <text x="358" y="213" class="mono fg" font-size="15" font-weight="600">backnotprop/pstack</text>
  <text x="342" y="263" class="mono mfg" font-size="11.5">npx skills add backnotprop/pstack</text>

  <!-- mirror -> agent harnesses -->
  <path class="wire" d="M576 197 L610 197 C 658 197, 656 117, 704 117"/>
  <path class="wire" d="M576 197 L610 197 C 658 197, 656 149, 704 149"/>
  <path class="wire" d="M576 197 L610 197 C 658 197, 656 181, 704 181"/>
  <path class="wire" d="M576 197 L610 197 C 658 197, 656 213, 704 213"/>
  <path class="wire" d="M576 197 L610 197 C 658 197, 656 245, 704 245"/>
  <path class="wire" d="M576 197 L610 197 C 658 197, 656 277, 704 277"/>
  <path class="spark s2" d="M576 197 L610 197 C 658 197, 656 117, 704 117" pathLength="100"/>
  <path class="spark s2" d="M576 197 L610 197 C 658 197, 656 149, 704 149" pathLength="100"/>
  <path class="spark s2" d="M576 197 L610 197 C 658 197, 656 181, 704 181" pathLength="100"/>
  <path class="spark s2" d="M576 197 L610 197 C 658 197, 656 213, 704 213" pathLength="100"/>
  <path class="spark s2" d="M576 197 L610 197 C 658 197, 656 245, 704 245" pathLength="100"/>
  <path class="spark s2" d="M576 197 L610 197 C 658 197, 656 277, 704 277" pathLength="100"/>
  <circle cx="610" cy="197" r="3" fill="#5537eb"/>

  <rect x="704" y="104" width="216" height="26" rx="7" fill="#ffffff" stroke="#d4d8de"/>
  <circle cx="718" cy="117" r="3" fill="#5537eb" stroke="#5537eb" stroke-width="1.2"/>
  <text x="730" y="121.5" class="sans fg" font-size="13" font-weight="500">Claude Code</text>
  <rect x="704" y="136" width="216" height="26" rx="7" fill="#ffffff" stroke="#d4d8de"/>
  <circle cx="718" cy="149" r="3" fill="#5537eb" stroke="#5537eb" stroke-width="1.2"/>
  <text x="730" y="153.5" class="sans fg" font-size="13" font-weight="500">Codex</text>
  <rect x="704" y="168" width="216" height="26" rx="7" fill="#ffffff" stroke="#d4d8de"/>
  <circle cx="718" cy="181" r="3" fill="#5537eb" stroke="#5537eb" stroke-width="1.2"/>
  <text x="730" y="185.5" class="sans fg" font-size="13" font-weight="500">Pi</text>
  <rect x="704" y="200" width="216" height="26" rx="7" fill="#ffffff" stroke="#d4d8de"/>
  <circle cx="718" cy="213" r="3" fill="#5537eb" stroke="#5537eb" stroke-width="1.2"/>
  <text x="730" y="217.5" class="sans fg" font-size="13" font-weight="500">Cursor</text>
  <rect x="704" y="232" width="216" height="26" rx="7" fill="#ffffff" stroke="#d4d8de"/>
  <circle cx="718" cy="245" r="3" fill="#5537eb" stroke="#5537eb" stroke-width="1.2"/>
  <text x="730" y="249.5" class="sans fg" font-size="13" font-weight="500">OpenCode</text>
  <rect x="704" y="264" width="216" height="26" rx="7" fill="#ffffff" stroke="#d4d8de" stroke-dasharray="3 3"/>
  <circle cx="718" cy="277" r="3" fill="#ffffff" stroke="#5537eb" stroke-width="1.2"/>
  <text x="730" y="281.5" class="sans mfg" font-size="13" font-weight="400">+ other agents</text>
  </g>
</svg>
